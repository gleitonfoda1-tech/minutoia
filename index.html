<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MinutoIA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    textarea, input, button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #38bdf8;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      min-height: 80px;
    }
  </style>
</head>
<body>

<h1>MinutoIA</h1>
<p>Create professional AI text in seconds.</p>

<textarea id="prompt" placeholder="Write what you want (idea, ad, email, text...)"></textarea>

<button onclick="generate()">Generate</button>

<div id="result"></div>

<script>
function generate() {
  const prompt = document.getElementById("prompt").value;
  if (!prompt) {
    alert("Write something first");
    return;
  }

  document.getElementById("result").innerHTML =
    "🚀 AI Response:<br><br>" +
    "This is where your AI text will appear. " +
    "Next step we will connect a real AI API.";
}
</script>

</body>
</html>
