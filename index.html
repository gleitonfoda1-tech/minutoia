<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MinutoIA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      max-width: 400px;
      padding: 20px;
      background: #020617;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,.5);
    }
    h1 {
      color: #38bdf8;
    }
    p {
      color: #cbd5f5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>MinutoIA</h1>
    <p>AI for text & ideas</p>
    <p>Site funcionando ✅</p>
  </div>
</body>
</html>
