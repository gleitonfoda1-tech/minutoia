<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MinutoIA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #020617;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      border: none;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    .output {
      margin-top: 20px;
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      min-height: 80px;
    }
  </style>
</head>
<body>

<header>MinutoIA — AI for Text & Images</header>

<main>
  <p>Type what you want the AI to create:</p>
  <textarea id="prompt" placeholder="Example: Write a sales text for a restaurant"></textarea>
  <button onclick="generate()">Generate</button>

  <div class="output" id="output">
    Your AI response will appear here.
  </div>
</main>

<script>
function generate() {
  const text = document.getElementById("prompt").value;
  document.getElementById("output").innerText =
    "⚠️ AI will be connected next.\n\nYour request:\n" + text;
}
</script>

</body>
</html>
